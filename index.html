<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モーマンタイム 便利ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムフォントとベーススタイル */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a; /* Tailwind's slate-900 */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
        }

        /* ボタンのホバーエフェクト用 */
        .tool-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tool-button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.4), 0 10px 10px -5px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <!-- ヘッダー部分 -->
    <header class="mb-12 text-center">
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 drop-shadow-sm mb-4">
            モーマンタイム<br class="sm:hidden" /> 便利ツール
        </h1>
        <p class="text-slate-400 text-sm md:text-base font-medium">
            各ツールへ素早くアクセスできます
        </p>
    </header>

    <!-- 2x2 グリッドコンテナ -->
    <!-- max-w-md でPCで見てもボタンが大きくなりすぎないように制限 -->
    <main class="w-full max-w-lg mx-auto">
        <div class="grid grid-cols-2 gap-4 sm:gap-6">
            
            <!-- ボタン1: 同盟対決ポイント計算機 -->
            <a href="https://astronoka2030.github.io/moman-calc/" target="_blank" rel="noopener noreferrer" 
               class="tool-button aspect-square flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 hover:border-blue-500/50 group text-center no-underline relative overflow-hidden">
                <!-- 装飾用の光彩 -->
                <div class="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative z-10">
                    <svg class="w-10 h-10 sm:w-12 sm:h-12 mx-auto mb-3 text-blue-400 group-hover:text-blue-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span class="text-base sm:text-lg md:text-xl font-bold leading-tight text-slate-200 group-hover:text-white">
                        同盟対決<br>ポイント計算機
                    </span>
                </div>
            </a>

            <!-- ボタン2: アプデ内容 -->
            <a href="https://astronoka2030.github.io/moman-update2026-10-16/" target="_blank" rel="noopener noreferrer" 
               class="tool-button aspect-square flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 hover:border-emerald-500/50 group text-center no-underline relative overflow-hidden">
                <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative z-10">
                    <svg class="w-10 h-10 sm:w-12 sm:h-12 mx-auto mb-3 text-emerald-400 group-hover:text-emerald-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                    <span class="text-base sm:text-lg md:text-xl font-bold leading-tight text-slate-200 group-hover:text-white">
                        アプデ内容<br><span class="text-sm sm:text-base text-emerald-400/80 group-hover:text-emerald-300 mt-1 block">2026/10/16</span>
                    </span>
                </div>
            </a>

            <!-- ボタン3: 名士スキル効果一覧 -->
            <a href="https://astronoka2030.github.io/moman-meishi-skills/index.html" target="_blank" rel="noopener noreferrer" 
               class="tool-button aspect-square flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 hover:border-amber-500/50 group text-center no-underline relative overflow-hidden">
                <div class="absolute inset-0 bg-amber-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative z-10">
                    <svg class="w-10 h-10 sm:w-12 sm:h-12 mx-auto mb-3 text-amber-400 group-hover:text-amber-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span class="text-base sm:text-lg md:text-xl font-bold leading-tight text-slate-200 group-hover:text-white">
                        名士スキル<br>効果一覧
                    </span>
                </div>
            </a>

            <!-- ボタン4: 傑作組合せ効果一覧 -->
            <a href="https://astronoka2030.github.io/moman-kessaku/" target="_blank" rel="noopener noreferrer" 
               class="tool-button aspect-square flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 hover:border-purple-500/50 group text-center no-underline relative overflow-hidden">
                <div class="absolute inset-0 bg-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative z-10">
                    <svg class="w-10 h-10 sm:w-12 sm:h-12 mx-auto mb-3 text-purple-400 group-hover:text-purple-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    <span class="text-base sm:text-lg md:text-xl font-bold leading-tight text-slate-200 group-hover:text-white">
                        傑作組合せ<br>効果一覧
                    </span>
                </div>
            </a>

        </div>
    </main>

    <!-- フッター -->
    <footer class="mt-16 text-center text-slate-500 text-sm">
        <p>&copy; 2026 モーマンタイム 便利ツール</p>
    </footer>

</body>
</html>
